volumes:
  mongo-data:
  certbot-www:
  certbot-conf:
  certbot-lib:
  loki-data:
  uptime-kuma-data:
  backup-data:

networks:
  shm-network:
    driver: bridge

services:
  # ── Reverse proxy ─────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-lib:/var/lib/letsencrypt:ro
    depends_on:
      - frontend
      - backend
      - blockchain-service
    networks:
      - shm-network
    restart: unless-stopped
    mem_limit: 64m
    cpus: "0.25"
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Certbot (initialisation + renouvellement) ────────────────────────────
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
      - certbot-lib:/var/lib/letsencrypt
    entrypoint: >
      sh -c "
        certbot certonly --webroot -w /var/www/certbot
        --email admin@smart-hive-mind.example.com
        -d smart-hive-mind.example.com
        --agree-tos --non-interactive
        && echo 'Certificats obtenus avec succes.'
        trap exit TERM;
        while :; do
          sleep 12h & wait \$\$!;
          certbot renew --quiet;
        done
      "
    networks:
      - shm-network
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "certbot", "certificates", "-q"]
      interval: 3600s
      timeout: 30s
      retries: 2
      start_period: 60s

  # ── Donnees ───────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    networks:
      - shm-network
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.5"
    healthcheck:
      test: mongosh --eval "db.adminCommand('ping')" --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Backend ───────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      args:
        - NODE_ENV=production
    environment:
      - NODE_ENV=production
      - MONGODB_URI=${MONGO_URI}
      - BLOCKCHAIN_SERVICE_URL=http://blockchain-service:4000
      - AI_DIAGNOSTIC_URL=http://ai-diagnostic:8000
      - AI_PREDICTIVE_URL=http://ai-predictive:8000
      - AI_DECISIONNEL_URL=http://ai-decisionnel:8000
      - AI_CONVERSATIONAL_URL=http://ai-conversational:8000
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}
      - PORT=3000
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - shm-network
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/dashboard/summary',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Frontend (fichiers statiques) ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        - CONFIGURATION=production
    networks:
      - shm-network
    restart: unless-stopped
    mem_limit: 32m
    cpus: "0.1"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── IA ────────────────────────────────────────────────────────────────────
  ai-diagnostic:
    build: ./ai-services/diagnostic
    environment:
      - MONGODB_URI=${MONGO_URI}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - shm-network
    restart: unless-stopped
    mem_limit: 1024m
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  ai-predictive:
    build: ./ai-services/predictive
    environment:
      - MONGODB_URI=${MONGO_URI}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - shm-network
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  ai-decisionnel:
    build: ./ai-services/decisionnel
    environment:
      - MONGODB_URI=${MONGO_URI}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - shm-network
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  ai-conversational:
    build: ./ai-services/conversational
    environment:
      - MONGODB_URI=${MONGO_URI}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - shm-network
    restart: unless-stopped
    mem_limit: 2048m
    cpus: "2.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s

  ai-agentic:
    build: ./ai-services/agentic
    environment:
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - shm-network
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Blockchain ────────────────────────────────────────────────────────────
  blockchain-service:
    build: ./blockchain-service
    environment:
      - NODE_ENV=production
      - SEPOLIA_RPC_URL=${SEPOLIA_RPC_URL}
      - PRIVATE_KEY=${PRIVATE_KEY}
      - CONTRACT_ADDRESS=${CONTRACT_ADDRESS}
      - PORT=4000
    networks:
      - shm-network
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.25"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/verify/0xtest',r=>process.exit(r.statusCode===404||r.status===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Sauvegarde automatique (cron) ─────────────────────────────────────────
  cron-backup:
    build:
      context: ./backend/scripts
      dockerfile: backup.Dockerfile
    volumes:
      - backup-data:/backups
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/smart-hive-mind}
      - B2_ENDPOINT=${B2_ENDPOINT}
      - B2_BUCKET=${B2_BUCKET}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - RETENTION=7
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - shm-network
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "pgrep", "-x", "cron"]
      interval: 60s
      timeout: 5s
      retries: 2
      start_period: 10s

  # ── Logs centralises (Loki + Promtail) ───────────────────────────────────
  loki:
    image: grafana/loki:3.4
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - shm-network
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.25"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  promtail:
    image: grafana/promtail:3.4
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - shm-network
    restart: unless-stopped
    mem_limit: 64m
    cpus: "0.1"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9080/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Monitoring (Uptime‑Kuma) ─────────────────────────────────────────────
  uptime-kuma:
    image: louislam/uptime-kuma:1
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    networks:
      - shm-network
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.25"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
