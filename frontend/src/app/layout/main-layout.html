<div class="layout" [class.sidebar-closed]="!sidebarOpen()">
  <aside class="sidebar" [class.open]="sidebarOpen()" [class.collapsed]="!sidebarOpen() && !isMobile()">
    <div class="sidebar-header">
      <a class="logo" routerLink="/app/dashboard">
        <svg class="logo-hex" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" width="32" height="32">
          <polygon points="24 3 43 16 43 32 24 45 5 32 5 16" stroke="currentColor" stroke-width="1.5" fill="none" />
          <text x="24" y="30" text-anchor="middle" font-family="Fraunces, serif" font-size="16" font-weight="700" fill="currentColor">SHM</text>
        </svg>
      </a>
      <button class="toggle-btn" (click)="toggleSidebar()" aria-label="Toggle sidebar">
        <i class="pi pi-chevron-left"></i>
      </button>
    </div>

    <nav class="nav-list">
      @for (section of visibleSections(); track section.name; let idx = $index) {
        <div class="nav-section">
          <button class="nav-section-title"
                  (click)="toggleSection(section.name)"
                  [attr.aria-expanded]="isSectionExpanded(section.name)">
            <i class="pi pi-chevron-down section-chevron"
               [class.collapsed]="!isSectionExpanded(section.name)"></i>
            <span>{{ section.name }}</span>
          </button>

          @if (isSectionExpanded(section.name)) {
            <div class="section-items">
              @for (item of section.items; track item.route) {
                <a class="nav-item"
                   [routerLink]="item.route"
                   routerLinkActive="active"
                   [routerLinkActiveOptions]="{exact: false}"
                   (click)="closeSidebar()"
                   [attr.aria-label]="item.label">
                  <i [class]="item.iconClass"></i>
                  <span class="nav-label">{{ item.label }}</span>
                </a>
              }
            </div>
          }
        </div>
      }
    </nav>

    <div class="sidebar-footer">
      <span class="version">v1.0</span>
    </div>
  </aside>

  <div class="overlay" [class.show]="isMobile() && sidebarOpen()" (click)="closeSidebar()"></div>

  <div class="main">
    <header class="topbar">
      <button class="hamburger" (click)="toggleSidebar()" aria-label="Menu">
        <i class="pi pi-bars"></i>
      </button>
      <span class="topbar-title">Smart Hive Mind</span>
      <div class="search-wrapper">
        <i class="pi pi-search search-icon"></i>
        <input class="search-input" type="text" placeholder="Rechercher une publication, un membre, un hash…" [value]="searchQuery" (input)="onSearch($any($event.target).value)" (keydown.enter)="doSearch()" />
      </div>
      <div class="topbar-spacer"></div>
      <app-theme-toggle />
      <app-notification-bell />
      <button class="logout-btn" (click)="logout()">
        <i class="pi pi-sign-out"></i>
        <span>Déconnexion</span>
      </button>
    </header>

    <main class="content" @fadeInUp>
      <router-outlet />
    </main>

    <button class="fab-scroll" (click)="scrollToTop()" [class.visible]="showScrollFab()" aria-label="Retour en haut">
      <i class="pi pi-arrow-up"></i>
    </button>

    <nav class="bottom-nav">
      @for (item of bottomNavItems(); track item.route) {
        <a class="bottom-nav-item"
           [routerLink]="item.route"
           routerLinkActive="active"
           (click)="closeSidebar()"
           [attr.aria-label]="item.label">
          <i [class]="item.iconClass"></i>
          <span class="nav-label">{{ item.label }}</span>
        </a>
      }
    </nav>

    <app-ai-assistant-widget />
    <app-toast />
    <app-confirm-dialog />
  </div>
</div>
