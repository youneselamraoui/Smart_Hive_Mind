<div class="layout" [class.sidebar-closed]="!sidebarOpen()">
  <aside class="sidebar" [class.open]="sidebarOpen()">
    <div class="sidebar-header">
      <a class="logo" routerLink="/app/dashboard">
        <svg class="logo-hex" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" width="32" height="32">
          <polygon points="24 3 43 16 43 32 24 45 5 32 5 16" stroke="currentColor" stroke-width="1.5" fill="none" />
          <text x="24" y="30" text-anchor="middle" font-family="Fraunces, serif" font-size="16" font-weight="700" fill="currentColor">SHM</text>
        </svg>
      </a>
      <button class="toggle-btn" (click)="toggleSidebar()" aria-label="Toggle sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
    </div>

    <nav class="nav-list">
      @for (item of visibleNavItems(); track item.route) {
        <a class="nav-item"
           [routerLink]="item.route"
           routerLinkActive="active"
           (click)="closeSidebar()"
           [innerHtml]="item.icon"
           [attr.data-label]="item.label">
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      <span class="version">v1.0</span>
    </div>
  </aside>

  <div class="overlay" [class.show]="isMobile() && sidebarOpen()" (click)="closeSidebar()"></div>

  <div class="main">
    <header class="topbar">
      <button class="hamburger" (click)="toggleSidebar()" aria-label="Menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="topbar-title">Smart Hive Mind</span>
      <div class="search-wrapper">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search-input" type="text" placeholder="Rechercher une publication, un membre, un hash…" [value]="searchQuery" (input)="onSearch($any($event.target).value)" (keydown.enter)="doSearch()" />
      </div>
      <div class="topbar-spacer"></div>
      <app-theme-toggle />
      <app-notification-bell />
      <button class="logout-btn" (click)="logout()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Déconnexion</span>
      </button>
    </header>

    <main class="content" @fadeInUp>
      <router-outlet />
    </main>

    <button class="fab-scroll" (click)="scrollToTop()" [class.visible]="showScrollFab()" aria-label="Retour en haut">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="18 15 12 9 6 15"/></svg>
    </button>

    <nav class="bottom-nav">
      @for (item of visibleNavItems().slice(0, 5); track item.route) {
        <a class="bottom-nav-item"
           [routerLink]="item.route"
           routerLinkActive="active"
           (click)="closeSidebar()"
           [innerHtml]="item.icon"
           [attr.data-label]="item.label">
        </a>
      }
    </nav>

    <app-ai-assistant-widget />
    <app-toast />
    <app-confirm-dialog />
  </div>
</div>
