name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  test-contracts:
    name: Test Smart Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
        working-directory: contracts
      - run: npx hardhat compile
        working-directory: contracts
      - run: npx hardhat test
        working-directory: contracts
      - name: Upload ABI artifact
        uses: actions/upload-artifact@v4
        with:
          name: contract-abi
          path: contracts/artifacts/contracts/ProofRegistry.sol/ProofRegistry.json

  test-backend:
    name: Test Backend API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend

  test-ai-services:
    name: Test AI Services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ai-services/tests/requirements-test.txt
      - name: Install test dependencies
        run: pip install pytest pytest-asyncio httpx numpy
      - name: Train predictive model for tests
        run: |
          cd ai-services/predictive
          pip install -r requirements.txt --quiet
          python src/train.py
      - name: Install diagnostic & decisionnel dependencies
        run: |
          pip install -r ai-services/diagnostic/requirements.txt --quiet
          pip install -r ai-services/decisionnel/requirements.txt --quiet
      - run: pytest ai-services/tests/ -v

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Angular CLI
        run: npm install -g @angular/cli
      - run: npm ci
        working-directory: frontend
      - run: ng lint
        working-directory: frontend

  sonarqube-scan:
    name: SonarQube Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: sonarsource/sonarqube-scan-action@v4
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  build-images:
    name: Build & Trivy Scan
    runs-on: ubuntu-latest
    needs:
      - test-contracts
      - test-backend
      - test-ai-services
      - lint-frontend
    steps:
      - uses: actions/checkout@v4
      - name: Build backend
        run: docker build -t shm-backend ./backend
      - name: Build frontend
        run: docker build -t shm-frontend ./frontend
      - name: Build AI diagnostic
        run: docker build -t shm-ai-diagnostic ./ai-services/diagnostic
      - name: Build AI predictive
        run: docker build -t shm-ai-predictive ./ai-services/predictive
      - name: Build AI decisionnel
        run: docker build -t shm-ai-decisionnel ./ai-services/decisionnel
      - name: Build blockchain-service
        run: docker build -t shm-blockchain-service ./blockchain-service
      - name: Trivy scan backend
        uses: aquasecurity/trivy-action@v0.29.0
        with:
          image-ref: shm-backend
          format: table
          exit-code: "1"
          severity: "CRITICAL,HIGH"
      - name: Trivy scan frontend
        uses: aquasecurity/trivy-action@v0.29.0
        with:
          image-ref: shm-frontend
          format: table
          exit-code: "1"
          severity: "CRITICAL,HIGH"
      - name: Trivy scan AI diagnostic
        uses: aquasecurity/trivy-action@v0.29.0
        with:
          image-ref: shm-ai-diagnostic
          format: table
          exit-code: "1"
          severity: "CRITICAL,HIGH"
      - name: Trivy scan AI predictive
        uses: aquasecurity/trivy-action@v0.29.0
        with:
          image-ref: shm-ai-predictive
          format: table
          exit-code: "1"
          severity: "CRITICAL,HIGH"
      - name: Trivy scan AI decisionnel
        uses: aquasecurity/trivy-action@v0.29.0
        with:
          image-ref: shm-ai-decisionnel
          format: table
          exit-code: "1"
          severity: "CRITICAL,HIGH"
      - name: Trivy scan blockchain-service
        uses: aquasecurity/trivy-action@v0.29.0
        with:
          image-ref: shm-blockchain-service
          format: table
          exit-code: "1"
          severity: "CRITICAL,HIGH"
